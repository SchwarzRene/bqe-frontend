name: Market data

# 22:20 UTC on weekdays — about 90 minutes after the US close, so the
# daily bar is settled. Also runnable by hand from the Actions tab.
on:
  schedule:
    - cron: "20 22 * * 1-5"
  workflow_dispatch:
    inputs:
      limit:
        description: "Only fetch the first N tickers (0 = all)"
        required: false
        default: "0"

permissions:
  contents: write

concurrency:
  group: market-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Fetch prices
        run: |
          python scripts/fetch_market_data.py \
            --out stack/data \
            --limit "${{ github.event.inputs.limit || 0 }}"

      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stack/data
          if git diff --quiet --cached; then
            echo "nothing changed"
          else
            git commit -m "Market data $(date -u +'%Y-%m-%d')"
            git push
          fi
