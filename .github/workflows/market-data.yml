name: Market data

# 22:20 UTC on weekdays — about 90 minutes after the US close, so the
# daily bar is settled. Also runnable by hand from the Actions tab.
on:
  schedule:
    - cron: "20 22 * * 1-5"
  workflow_dispatch:
    inputs:
      limit:
        description: "Only fetch the first N tickers (0 = all)"
        required: false
        default: "0"

permissions:
  contents: write

concurrency:
  group: market-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Fetch prices
        run: |
          python scripts/fetch_market_data.py \
            --out stack/data \
            --limit "${{ github.event.inputs.limit || 0 }}"

      - name: Commit
        run: |
          git config user.name  "SchwarzRene"
          git config user.email "123473580+SchwarzRene@users.noreply.github.com"
          git add stack/data
          if git diff --quiet --cached; then
            echo "nothing changed"
            exit 0
          fi
          git commit -m "Market data $(date -u +'%Y-%m-%d')"
          # Someone may have pushed while the fetch ran; rebase onto them and retry.
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "push rejected, rebasing onto the remote (attempt $attempt)"
            git pull --rebase --autostash origin "${{ github.ref_name }}" || exit 1
            sleep 5
          done
          exit 1
