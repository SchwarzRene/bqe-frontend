name: Market tape

# Twice on weekdays: 12:10 UTC (before the US open, picks up the day's
# schedule) and 22:10 UTC (after the close, picks up the numbers).
# Also runnable by hand from the Actions tab.
on:
  schedule:
    - cron: "10 12 * * 1-5"
    - cron: "10 22 * * 1-5"
  workflow_dispatch:
    inputs:
      tickers:
        description: "Earnings watchlist (space separated)"
        required: false
        default: "NVDA AAPL MSFT AMZN GOOGL"

permissions:
  contents: write

concurrency:
  group: market-tape
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Build the rundown
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python scripts/fetch_market_tape.py \
            --out research/markettape/data \
            --tickers ${{ github.event.inputs.tickers || 'NVDA AAPL MSFT AMZN GOOGL' }}

      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/markettape/data
          if git diff --quiet --cached; then
            echo "nothing changed"
          else
            git commit -m "Market tape $(date -u +'%Y-%m-%d %H:%M')"
            git push
          fi
