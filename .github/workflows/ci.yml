name: CI

# Cheap checks that catch the mistakes a static site actually makes: a moved
# file that something still points at, or a page that stops being valid HTML.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Check internal links and assets
        run: python3 .github/check-links.py

      - name: Check the entry point exists
        run: test -f index.html

      - name: Check no secret slipped in
        run: |
          # A crude net, and worth having: GitHub's own push protection is the
          # real one, but this catches a key pasted into a committed JSON file.
          if grep -rIlE '(sk-ant-[A-Za-z0-9_-]{20,}|AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{36})' \
               --exclude-dir=.git . ; then
            echo "::error::something that looks like a credential is committed"
            exit 1
          fi
          echo "no obvious credentials found"
