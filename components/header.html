<header role="banner">
  <div class="header-top">
    <div class="container header-content">
      <!-- Logo Section -->
      <a href="/index.html" class="logo-link" aria-label="Black Quant Empire - Home">
        <div class="logo-group">
          <img
            src="/assets/images/logo.webp"
            alt="Black Quant Empire logo: bull above a candlestick chart"
            width="50"
            height="50"
            class="logo-image"
          />
          <div class="logo-text">
            <span class="logo-name">Black Quant Empire</span>
            <span class="logo-tagline">Quantitative Trading</span>
          </div>
        </div>
      </a>

      <!-- Login Button -->
      <button
        id="login-btn"
        class="login-button"
        aria-label="Open login"
      >
        Login
      </button>

      <!-- Mobile Menu Toggle Button -->
      <button
        class="nav-toggle"
        aria-expanded="false"
        aria-controls="primary-navigation"
        aria-label="Open navigation menu"
      >
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
      </button>

      <!-- Primary Navigation (Categorized) -->
      <nav id="primary-navigation" aria-label="Primary navigation" class="primary-nav">
        <!-- The nav-wave SVG (a slim echo of the hero's price line, threaded
             through the mobile menu items) is built by navigation.js against
             the links' real positions - see initNavWave(). -->
        <ul role="list" class="nav-list">
          <!-- About us and Careers are reachable from the footer's
               Company column; the header keeps only the pages a
               visitor is most likely to want. -->
          <li class="nav-item"><a href="/index.html" class="nav-link nav-cta">Home</a></li>
          <li class="nav-item"><a href="/research/" class="nav-link nav-cta">Research</a></li>
          <li class="nav-item"><a href="/pages/contact.html" class="nav-link nav-cta">Contact</a></li>
          <!-- Phones only: the header's Login button is hidden below 769px,
               so the menu carries it instead. Opens the same modal. -->
          <li class="nav-item nav-item-login">
            <button type="button" id="nav-login-btn" class="nav-link nav-cta nav-login">Login</button>
          </li>
        </ul>
      </nav>
    </div>
  </div>

  <!-- Login Modal -->
  <div id="login-modal" class="login-modal" hidden>
    <div class="login-modal-content">
      <button id="login-close" class="login-modal-close" aria-label="Close login">&times;</button>
      <h2 id="login-title">Login</h2>
      <form id="login-form" class="login-form">
        <div class="login-form-group">
          <label for="username">Username</label>
          <input
            type="text"
            id="username"
            name="username"
            placeholder="Enter username"
            autocomplete="username"
            required
          />
        </div>
        <div class="login-form-group">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter password"
            autocomplete="current-password"
            required
          />
        </div>
        <p id="login-error" class="login-error" role="alert"></p>
        <button type="submit" class="login-submit">Sign in</button>
      </form>

      <!-- Shown instead of the form once signed in (navigation.js). -->
      <div id="account-panel" class="login-form" hidden>
        <p class="login-account">Signed in as <strong id="account-name"></strong>. Your work in the research apps is saved to this account.</p>
        <form id="password-form" class="login-form">
          <div class="login-form-group">
            <label for="current-password">Current password</label>
            <input type="password" id="current-password" name="current" autocomplete="current-password" required />
          </div>
          <div class="login-form-group">
            <label for="new-password">New password (at least 8 characters)</label>
            <input type="password" id="new-password" name="next" autocomplete="new-password" minlength="8" required />
          </div>
          <p id="password-status" class="login-error" role="status"></p>
          <button type="submit" class="login-submit">Change password</button>
        </form>
        <button type="button" id="logout-btn" class="login-submit login-secondary">Sign out</button>
      </div>
    </div>
  </div>
</header>
