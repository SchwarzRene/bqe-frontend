# Cloudflare Workers configuration.
#
# One Worker does everything the site needs: it serves the static files in
# _site/ (built by build.sh), answers /api/*, and runs the scheduled jobs that
# used to live in bqe-backend on GitHub Actions and Azure. There is no server.
#
#   request ─▶ static asset?  ─▶ served from the CDN, no code runs
#          └─▶ run_worker_first path ─▶ worker/index.ts ─▶ D1 / Yahoo
#   cron   ─▶ worker/index.ts scheduled() ─▶ Yahoo / Wikipedia / Gemini ─▶ D1
#
# See docs/DEPLOYMENT.md for the one-time setup (database, secrets).

name = "bqe-frontend"
main = "worker/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

# Keep variables added in the dashboard when deploying. Secrets are never
# touched by a deploy; this also protects plain-text variables set there.
# (Top-level: under a [table] heading wrangler would ignore it.)
keep_vars = true

[assets]
directory = "./_site"
binding = "ASSETS"

# "auto-trailing-slash" maps /research/stack/ to research/stack/index.html and
# /pages/about to pages/about.html, which is how every link in the site is
# written.
html_handling = "auto-trailing-slash"
not_found_handling = "none"

# Assets win by default, so without this a committed data file would shadow
# the fresher copy in D1. These paths go to the Worker first; it serves from
# D1 and falls back to the committed file when D1 has nothing yet.
run_worker_first = [
  "/api/*",
  "/research/stack/data/*",
]

[[d1_databases]]
binding = "DB"
database_name = "bqe"
# database_id is filled in by `npx wrangler d1 create bqe` (paste the id here),
# or left out: wrangler then creates the database on the first deploy.
migrations_dir = "migrations"

# Rate limits in front of D1, PBKDF2 and Yahoo (worker/http.ts `allowed`).
# Counted per visitor hash and per Cloudflare location, so they are a flood
# guard rather than an exact quota; the exact per-account limits are in D1
# (worker/auth.ts). A namespace_id is any number unique within the account.
[[ratelimits]]
name = "AUTH_LIMITER"
namespace_id = "1001"
simple = { limit = 20, period = 60 }   # sign-in, sign-up, password: 20 a minute

[[ratelimits]]
name = "MARKET_LIMITER"
namespace_id = "1002"
simple = { limit = 120, period = 60 }  # /api/market/*, /api/quotes/*: 120 a minute

[triggers]
crons = [
  # Stack prices: a batch every 3 minutes for the two hours after 22:00 UTC
  # on weekdays — the US close has settled by then. Each run takes the next
  # tickers not yet refreshed today, so the 500 are spread over many small
  # invocations instead of one that would hit the subrequest limit.
  "*/3 22-23 * * 1-5",
  # Market News: every 15 minutes. worker/news/index.ts decides per run what
  # is due — fetching (every run on weekdays, hourly at weekends), the
  # briefings at fixed New York times, the calendar and the daily clean-up
  # (old contact messages, sessions, news) at 05:00 New York time.
  # One trigger instead of one per job: the free plan allows 5 per account.
  "*/15 * * * *",
]

[vars]
# Tickers refreshed per cron run. 40 runs a night × 20 = 800 slots for ~503
# tickers, so failures get retried. Each ticker is two Yahoo requests.
STACK_BATCH = "20"
# Gemini model for the Market News briefing (and the chat, unless
# GEMINI_CHAT_MODEL is set). The watchlist, feeds and calendar sources are in
# worker/news/sources.json and worker/news/calendar.json.
GEMINI_MODEL = "gemini-3.5-flash-lite"
# Market News chat. GEMINI_CHAT_MODEL (unset: GEMINI_MODEL) picks a different
# model for it; NEWS_CHAT_SEARCH = "on" lets it search the web with Google
# Search grounding instead of only the app's own data.
# When the model is overloaded ("high demand", HTTP 503), over its quota or
# not available on the key, the same request goes to these, in order, after
# two short retries. Comma-separated; "off" for none. gemini-3.5-flash-lite is
# listed too, so it stays a fallback if GEMINI_MODEL or GEMINI_CHAT_MODEL is
# changed; a model is never asked twice, so while it is the main model the
# list effectively starts at gemini-3.1-flash-lite.
GEMINI_FALLBACK_MODEL = "gemini-3.5-flash-lite,gemini-3.1-flash-lite,gemini-3.6-flash,gemini-2.5-flash"
NEWS_CHAT_SEARCH = "off"
NEWS_CHAT_DAILY_LIMIT = "50"
# New accounts per hour, site-wide (on top of 5 per visitor per day).
SIGNUP_HOURLY_LIMIT = "30"
# New passwords are checked against Have I Been Pwned (only a 5-character
# hash prefix is sent). "off" to skip.
PASSWORD_BREACH_CHECK = "on"
# PBKDF2 iterations for passwords set from now on; older hashes are upgraded
# at the next sign-in. 50000 fits the free plan's 10 ms CPU; on Workers Paid
# set 600000 (OWASP's figure for PBKDF2-SHA256).
# PBKDF2_ITERATIONS = "600000"
# Cloudflare Turnstile on sign-up. The site key is public; the widget's
# secret is a Worker secret: `npx wrangler secret put TURNSTILE_SECRET` (or
# dashboard → Settings → Variables and Secrets). Sign-up asks for Turnstile
# only once the secret is set. A token counts only when solved for the
# "signup" action on the host the request came to; to accept other hosts set
# TURNSTILE_HOSTNAMES (comma-separated, never localhost in production).
TURNSTILE_SITE_KEY = "0x4AAAAAAFDkYVxRdLA47hLh"

[observability]
enabled = true
