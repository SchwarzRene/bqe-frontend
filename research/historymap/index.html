<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HistoryMap – Interaktiver Geschichtsatlas</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="map"></div>

<!-- Epochen-Panel (links oben) -->
<div id="era-panel" class="panel">
  <div id="era-header">
    <div>
      <div id="era-range"></div>
      <h2 id="era-title"></h2>
    </div>
    <button id="era-toggle" title="Ein-/Ausklappen">▾</button>
  </div>
  <div id="era-body">
    <div id="era-hegemon"></div>
    <div id="era-text"></div>
    <div class="era-section" id="era-denken-wrap">
      <h3>💭 Denkweisen &amp; Ideen</h3>
      <div id="era-denken"></div>
    </div>
    <div class="era-section" id="era-konflikte-wrap">
      <h3>⚔️ Große Konflikte</h3>
      <ul id="era-konflikte"></ul>
    </div>
    <div class="era-section" id="era-chronik-wrap">
      <h3>🗓️ Chronik – was geschah wann</h3>
      <div id="era-chronik"></div>
    </div>
    <div class="era-section" id="era-schlaglichter-wrap">
      <h3>🔍 Schlaglichter – klicke die Regionen an!</h3>
      <ul id="era-schlaglichter"></ul>
    </div>
  </div>
</div>

<!-- Detail-Sidebar (rechts) -->
<div id="sidebar" class="panel hidden">
  <button id="sidebar-close" title="Schließen">×</button>
  <h2 id="sb-title"></h2>
  <div id="sb-subtitle"></div>
  <div id="sb-report"></div>
  <div id="sb-wiki">
    <div id="sb-wiki-loading" class="hidden">Lade Wikipedia-Zusammenfassung …</div>
    <div id="sb-wiki-content"></div>
  </div>
</div>

<!-- Zeitleiste (unten) -->
<div id="timebar">
  <div id="timebar-controls">
    <button id="btn-prev" title="Früher (←)">◀</button>
    <button id="btn-play" title="Abspielen">▶︎▶︎</button>
    <button id="btn-next" title="Später (→)">▶</button>
    <button id="btn-events" title="Ereignis-Marker ein-/ausblenden">📍</button>
    <div id="year-label"></div>
  </div>
  <div id="slider-wrap">
    <input type="range" id="time-slider" min="0" max="0" step="1" value="0">
    <div id="slider-ticks"></div>
  </div>
</div>

<div id="attribution">Grenzen: <a href="https://github.com/aourednik/historical-basemaps" target="_blank">historical-basemaps</a> (grobe, umstrittene Näherungen!) · Texte: kuratiert + Wikipedia</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="js/eras.js"></script>
<script src="js/reports.js"></script>
<script src="js/events.js"></script>
<script src="js/chronicle.js"></script>
<script src="js/app.js"></script>
</body>
</html>
