; Broker / account / latency model for the EXAMPLE symbol (EURUSD-like, USD account).
; These are illustrative numbers - check every value against your own broker before trusting results.

[symbol]
digits = 5
contract_size = 100000
volume_min = 0.01
volume_max = 100
volume_step = 0.01
stops_level = 0
swap_long = -6.0           ; points per lot per night
swap_short = 2.0

[account]
initial_balance = 10000
leverage = 30
stop_out_level = 50
quote_to_account = 1.0     ; USD quote, USD account

[costs]
commission_per_lot = 3.5   ; per side, account currency
commission_mode = both
slippage_points = 0
deviation_points = -1
round_money = true

[latency]                  ; milliseconds
feed_ms = 0
open_ms = 20
close_ms = 20
modify_ms = 20
jitter_ms = 5
seed = 1

[tester]
use_trade_sessions = false ; the example symbol trades 24h on weekdays
close_at_end = true
equity_sample_ms = 60000
bar_history = 1024
