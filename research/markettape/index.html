<div class="wrap">
  <div class="top">
    <header class="masthead">
      <div class="brandline">
        <img src="/assets/images/logo.png" alt="" width="34" height="34">
        <div>
          <div class="brand">Market <span>News</span></div>
          <div class="dateline"><a href="/research/">← Research</a><span id="today"></span></div>
        </div>
      </div>
      <div class="tools">
        <span class="updated" id="updated"></span>
        <div class="seg" role="group" aria-label="Time zone" id="tz"></div>
        <button type="button" class="btn" id="refresh">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></svg>
          Refresh
        </button>
        <button type="button" class="btn primary ask" id="ask" aria-expanded="false" aria-controls="chat">
          <svg class="ico-chat" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>
          <svg class="ico-lock" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
          Ask AI
        </button>
        <span class="account" id="account"></span>
      </div>
    </header>
    <nav class="navrow" aria-label="Pages and region">
      <div class="tabs" id="tabs"></div>
      <button type="button" class="globe" id="globe" aria-expanded="false" aria-controls="mapbox" title="Pick a region on the map"></button>
    </nav>
    <section class="mapbox" id="mapbox" aria-label="Region map" hidden></section>
  </div>

  <main id="page" class="stack" style="gap:24px" aria-live="polite"></main>

  <footer><span>Headlines link to the original publishers. Summaries and the calendar ranking are written by AI (Gemini) from headlines and event titles only and may miss context. Not investment advice.</span><a href="/research/markettape.html">How this is built ↗</a></footer>
</div>

<aside class="chat" id="chat" role="dialog" aria-modal="false" aria-labelledby="chat-h" hidden>
  <div class="chat-head">
    <div>
      <h2 id="chat-h">Ask about today</h2>
      <p id="chat-context">Knows today's headlines, calendar and results</p>
    </div>
    <button type="button" class="icon-btn" id="chat-close" aria-label="Close chat">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <div class="chat-log" id="chat-log" aria-live="polite"></div>
  <div class="suggest" id="chat-suggest"></div>
  <form class="chat-form" id="chat-form">
    <label for="chat-input" class="sr-only">Your question</label>
    <textarea id="chat-input" rows="1" placeholder="Ask about markets, news or events…"></textarea>
    <button type="submit">Send</button>
  </form>
  <p class="chat-note" id="chat-note"></p>
</aside>

<script src="/assets/js/session.js"></script>
