<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Market News — a daily briefing on markets, stocks and commodities: AI-ranked top stories from free headlines, an on-now event calendar and a chat that answers from the collected headlines.">
<title>Market News</title>
<link rel="icon" href="/assets/images/logo.png" type="image/png">
<style>
/* Site palette, hard-coded per research/RESEARCH_PAPER_STYLE_GUIDE.md §2.
   The variable names are the mockup's own; the values are the site's. */
:root {
  --bg: #050810;          /* --color-black        */
  --surface: #070B15;     /* --color-black-soft   */
  --inset: #0F1A2C;       /* --color-black-muted  */
  --ink: #EEF2F8;         /* headings, --color-white */
  --fg: #A8B6C9;          /* body copy, gray-300  */
  --muted: #7C8DA6;       /* meta text, gray-400  */
  --rule: rgba(240,180,41,0.18);
  --rule-soft: rgba(240,180,41,0.10);
  --chip: #0F1A2C;
  --navy: rgba(19,35,61,0.5);
  --accent: #F0B429;
  --accent-light: #FFD166;
  --accent-dark: #C88F14;
  --on-accent: #050810;
  --blue: #59C0FF;        /* --color-navy-light   */
  --green: #6EE796;
  --red: #F87171;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --mono: "SF Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 16px; line-height: 1.55; }
a { color: var(--accent); }
a:hover { color: var(--accent-light); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
button { font: inherit; color: inherit; }
h1, h2, h3, p { margin: 0; }
strong { color: var(--ink); }

/* ── Static background network (frozen echo of the homepage hero) ── */
.bg-network { position: fixed; inset: 0; z-index: 0; pointer-events: none; background: linear-gradient(180deg, #070b15 0%, #0a1220 55%, #050810 100%); overflow: hidden; }
.bg-network-svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.bg-network::after { content: ''; position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 38%, rgba(5,8,16,0) 0%, rgba(5,8,16,0.35) 60%, rgba(3,5,10,0.82) 100%); }
body { background: transparent; }

/* The content column is opaque, so nothing needs its own backdrop (§6). */
.wrap { position: relative; z-index: 1; max-width: 1312px; margin: 0 auto; padding: 0 32px 56px; display: flex; flex-direction: column; gap: 40px; background: var(--bg); box-shadow: 0 0 0 1px var(--rule), 0 40px 120px rgba(0,0,0,0.55); }
@media (max-width: 640px) { .wrap { padding: 0 16px 40px; } }

/* Masthead: gold rule above and below, gold-tinted diagonal wash */
.top { margin: 0 -32px; }
@media (max-width: 640px) { .top { margin: 0 -16px; } }
.masthead { position: relative; display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; flex-wrap: wrap; background: var(--surface); border-top: 3px solid var(--accent); border-bottom: 3px solid var(--accent); padding: 36px 32px 28px; }
.masthead::before { content: ''; position: absolute; inset: 0; background: linear-gradient(135deg, rgba(240,180,41,.05) 0%, transparent 50%, rgba(240,180,41,.05) 100%); pointer-events: none; }
.masthead > * { position: relative; }
@media (max-width: 640px) { .masthead { padding: 28px 16px 22px; } }
.dateline { display: flex; gap: 12px; align-items: center; font-family: var(--mono); font-size: 13px; color: var(--muted); flex-wrap: wrap; }
.dateline a { color: var(--muted); text-decoration: none; }
.dateline a:hover { color: var(--accent); }
.brand { font-weight: 700; font-size: clamp(36px, 6vw, 52px); line-height: 1.05; letter-spacing: -0.02em; margin-top: 8px; color: var(--accent); }
.tools { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.updated { font-size: 14px; color: var(--muted); font-family: var(--mono); }
.seg { display: flex; border: 1px solid rgba(240,180,41,.35); border-radius: 8px; overflow: hidden; }
.seg button { min-height: 44px; padding: 0 16px; border: 0; background: transparent; cursor: pointer; font-weight: 600; font-size: 14px; color: var(--fg); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
.btn { min-height: 44px; padding: 0 16px; display: inline-flex; align-items: center; gap: 8px; border: 1px solid rgba(240,180,41,.35); border-radius: 8px; background: rgba(240,180,41,.08); color: var(--accent); cursor: pointer; font-weight: 600; font-size: 14px; }
.btn:hover { background: rgba(240,180,41,.14); }

.navrow { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; padding: 6px 32px; border-bottom: 1px solid var(--rule); background: var(--bg); }
@media (max-width: 640px) { .navrow { padding: 6px 16px; } }
.tabs { display: flex; gap: 28px; flex-wrap: wrap; }
.tabs a { min-height: 48px; display: flex; align-items: center; padding: 0 2px; border-bottom: 3px solid transparent; font-size: 19px; font-weight: 600; color: var(--muted); text-decoration: none; }
.tabs a:hover { color: var(--ink); }
.tabs a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--accent); }
.regions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.regions .lbl { font-family: var(--mono); font-size: 13px; color: var(--muted); }
.pills { display: flex; gap: 6px; flex-wrap: wrap; }
.pills button { min-height: 40px; padding: 0 16px; border: 1px solid var(--rule); border-radius: 999px; background: transparent; cursor: pointer; font-weight: 600; font-size: 14px; color: var(--fg); }
.pills button:hover { border-color: rgba(240,180,41,.45); }
.pills button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }

/* Layout */
.cols { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 56px; }
.cols.rev { grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); }
.stack { display: flex; flex-direction: column; gap: 32px; }
@media (max-width: 960px) {
  .cols, .cols.rev { grid-template-columns: minmax(0, 1fr); gap: 40px; }
}

.panel { background: var(--surface); border: 1px solid var(--rule); border-radius: 12px; padding: 24px; }
.sec-title { font-weight: 700; font-size: 30px; line-height: 1.15; letter-spacing: -0.01em; color: var(--ink); }
.side-title { font-weight: 700; font-size: 22px; margin-bottom: 8px; color: var(--ink); }
.sec-head { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; flex-wrap: wrap; }
.meta { font-size: 14px; color: var(--muted); }
.small-label { font-family: var(--mono); font-size: 12px; color: var(--accent); text-transform: uppercase; letter-spacing: .08em; }
.empty { color: var(--muted); font-size: 15px; padding: 12px 0; border-top: 1px solid var(--rule-soft); }

/* Calendar strip */
.strip { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); gap: 24px; }
@media (max-width: 960px) { .strip { grid-template-columns: minmax(0, 1fr); } }
.live { background: var(--inset); border: 1px solid rgba(248,113,113,.35); border-left: 4px solid var(--red); color: var(--ink); border-radius: 0 12px 12px 0; padding: 24px 28px; display: flex; flex-direction: column; gap: 10px; min-height: 180px; }
.live .small-label { color: var(--red); display: flex; align-items: center; gap: 8px; }
.live .title { font-size: 26px; font-weight: 700; line-height: 1.2; }
.live .sub { font-size: 15px; color: var(--fg); }
.live .none { color: var(--muted); font-size: 22px; font-weight: 600; }
.live a { align-self: flex-start; margin-top: 8px; min-height: 44px; display: inline-flex; align-items: center; gap: 8px; padding: 0 16px; border-radius: 8px; background: var(--accent); color: var(--on-accent); text-decoration: none; font-weight: 700; font-size: 14px; }
.live a:hover { background: var(--accent-light); color: var(--on-accent); }
.next { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
@media (max-width: 640px) { .next { grid-template-columns: minmax(0, 1fr); } }
.next > div { display: flex; flex-direction: column; gap: 6px; padding-top: 12px; border-top: 3px solid var(--accent); }
.next .row { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 15px; color: var(--ink); }
.next .cd { color: var(--accent-light); }
.next .t { font-size: 17px; font-weight: 600; line-height: 1.3; color: var(--ink); }

/* Overview */
.overview p { font-size: 20px; line-height: 1.6; max-width: 62ch; color: var(--fg); }
.themes { display: flex; gap: 8px; flex-wrap: wrap; }
.themes span { padding: 5px 14px; border-radius: 999px; background: rgba(240,180,41,.08); border: 1px solid rgba(240,180,41,.35); color: var(--accent); font-size: 14px; font-weight: 600; }

/* Stories */
.story { display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 16px; padding: 24px 0; border-top: 1px solid var(--rule); }
.story .rank { font-size: 40px; font-weight: 800; line-height: 1; color: var(--accent); }
.story .tags { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 13px; }
.story .dots { color: var(--accent); letter-spacing: 2px; font-size: 14px; }
.tag { padding: 1px 9px; border-radius: 6px; background: var(--chip); border: 1px solid var(--rule); color: var(--fg); font-weight: 600; }
.tag.new { background: rgba(110,231,150,.12); border-color: rgba(110,231,150,.45); color: var(--green); }
.tag.cont { background: transparent; border-color: var(--muted); color: var(--muted); }
.story h3 { font-weight: 700; font-size: 23px; line-height: 1.3; margin: 10px 0; color: var(--ink); }
.story .why { font-size: 16px; line-height: 1.6; max-width: 70ch; }
.story .why strong { color: var(--accent); }
.story .src { display: flex; gap: 14px; font-size: 14px; color: var(--muted); margin-top: 10px; flex-wrap: wrap; }

/* Lists */
.line-row { display: grid; grid-template-columns: 88px minmax(0, 1fr); gap: 12px; padding: 12px 0; border-top: 1px solid var(--rule-soft); font-size: 15px; line-height: 1.45; }
.line-row .k { font-family: var(--mono); font-weight: 600; color: var(--accent-light); }
.note { padding-top: 12px; border-top: 1px solid var(--rule-soft); font-size: 13px; color: var(--muted); }
.elsewhere a { font-size: 16px; font-weight: 600; line-height: 1.35; color: var(--ink); text-decoration: none; }
.elsewhere a:hover { color: var(--accent); text-decoration: underline; }
.elsewhere .item { padding: 12px 0; border-top: 1px solid var(--rule-soft); display: flex; flex-direction: column; gap: 4px; }

.day { padding: 14px 0; border-top: 1px solid var(--rule); display: flex; flex-direction: column; gap: 8px; }
.day .d { display: flex; gap: 8px; align-items: center; font-family: var(--mono); font-size: 13px; font-weight: 600; color: var(--ink); }
.today { padding: 1px 8px; border-radius: 6px; background: var(--accent); color: var(--on-accent); font-family: var(--sans); font-size: 12px; font-weight: 700; }
.ev { display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 10px; font-size: 14px; line-height: 1.4; }
.ev .tm { font-family: var(--mono); color: var(--muted); }
.ev .nm { font-weight: 600; color: var(--ink); }
.ev .r { color: var(--muted); }
.ev .res { color: var(--blue); }

/* Headlines */
.headlines { display: flex; flex-direction: column; gap: 20px; border-top: 3px solid var(--accent); padding-top: 24px; }
.hgrid { display: grid; gap: 32px; }
.hgrid.c3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.hgrid.c2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
@media (max-width: 960px) { .hgrid.c3, .hgrid.c2 { grid-template-columns: minmax(0, 1fr); } }
.hcol h3 { font-family: var(--mono); font-weight: 600; font-size: 12px; color: var(--accent); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 4px; }
.hl { padding: 12px 0; border-top: 1px solid var(--rule); display: flex; flex-direction: column; gap: 4px; }
.hl a { color: var(--ink); text-decoration: none; font-size: 16px; font-weight: 600; line-height: 1.35; }
.hl a:hover { color: var(--accent); text-decoration: underline; }
.hl span { font-size: 13px; color: var(--muted); }

/* Commodities */
.groups { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px; }
@media (max-width: 1100px) { .groups { grid-template-columns: minmax(0, 1fr); } }
.group { display: flex; flex-direction: column; gap: 16px; border-top: 3px solid var(--accent); }
.group h2 { font-weight: 700; font-size: 26px; color: var(--ink); }
.group .sum { font-size: 16px; line-height: 1.55; }
.group .nextbox { margin-top: auto; padding: 10px 14px; border-left: 4px solid var(--accent); border-radius: 0 8px 8px 0; background: rgba(240,180,41,.06); font-size: 14px; display: flex; gap: 8px; align-items: baseline; }
.group .nextbox b { font-weight: 600; color: var(--ink); }

footer { font-size: 13px; color: var(--muted); border-top: 1px solid var(--rule); padding-top: 16px; display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
footer a { white-space: nowrap; }

/* Chat */
.btn.ask { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.btn.ask:hover { background: var(--accent-light); }
/* AI features are for signed-in users: guests see a lock and get the sign-in dialog. */
.btn.ask .ico-lock { display: none; }
body.guest .btn.ask { background: rgba(240,180,41,.08); color: var(--accent); border-color: rgba(240,180,41,.35); }
body.guest .btn.ask .ico-lock { display: inline; }
body.guest .btn.ask .ico-chat { display: none; }
.account { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
.account .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
.account.is-user .dot { background: var(--green); }
.account button { min-height: 44px; padding: 0 4px; border: 0; background: none; color: var(--accent); cursor: pointer; font-weight: 600; font-size: 13px; text-decoration: underline; }
.account button:hover { color: var(--accent-light); }
/* The shared sign-in dialog from session.js, in this page's palette */
body dialog.bqe-login { background: var(--surface); color: var(--ink); border: 1px solid var(--rule); border-top: 3px solid var(--accent); border-radius: 12px; font-family: var(--sans); }
body dialog.bqe-login input { background: var(--inset); border-color: var(--rule); }
body dialog.bqe-login button { background: transparent; border-color: var(--rule); color: var(--fg); }
body dialog.bqe-login button[type=submit] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 700; }
body dialog.bqe-login .err { color: var(--red); }
.chat { position: fixed; top: 0; right: 0; bottom: 0; width: min(460px, 100%); background: var(--surface); border-left: 3px solid var(--accent); box-shadow: -12px 0 40px rgba(0,0,0,0.6); display: flex; flex-direction: column; z-index: 20; }
.chat[hidden] { display: none; }
.chat-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 20px 24px 16px; border-bottom: 1px solid var(--rule); }
.chat-head h2 { font-weight: 700; font-size: 24px; color: var(--accent); }
.chat-head p { font-size: 13px; color: var(--muted); margin-top: 2px; }
.icon-btn { min-width: 44px; min-height: 44px; display: inline-flex; align-items: center; justify-content: center; border: 1px solid var(--rule); border-radius: 8px; background: transparent; cursor: pointer; color: var(--fg); }
.icon-btn:hover { color: var(--accent); border-color: rgba(240,180,41,.45); }
.chat-log { flex: 1; overflow-y: auto; padding: 20px 24px; display: flex; flex-direction: column; gap: 16px; }
.msg { max-width: 92%; font-size: 15px; line-height: 1.6; }
.msg.user { align-self: flex-end; background: rgba(240,180,41,.12); border: 1px solid rgba(240,180,41,.35); color: var(--ink); padding: 10px 14px; border-radius: 12px 12px 4px 12px; }
.msg.bot { align-self: flex-start; }
.msg.bot p + p { margin-top: 8px; }
.msg .srcs { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.msg .srcs a { font-size: 13px; padding: 2px 10px; border-radius: 999px; background: var(--chip); border: 1px solid var(--rule); color: var(--accent-light); text-decoration: none; }
.msg .srcs a:hover { text-decoration: underline; }
.msg.pending { color: var(--muted); font-style: italic; }
.suggest { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 24px 12px; }
.suggest button { min-height: 40px; padding: 0 14px; border: 1px solid var(--rule); border-radius: 999px; background: transparent; cursor: pointer; font-size: 14px; text-align: left; color: var(--fg); }
.suggest button:hover { border-color: rgba(240,180,41,.45); color: var(--ink); }
.chat-form { display: flex; gap: 8px; padding: 12px 24px 20px; border-top: 1px solid var(--rule); }
.chat-form textarea { flex: 1; min-height: 48px; max-height: 140px; resize: vertical; padding: 12px; border: 1px solid var(--rule); border-radius: 8px; background: var(--inset); color: var(--ink); font: 15px var(--sans); }
.chat-form textarea::placeholder { color: var(--muted); }
.chat-form button { min-height: 48px; padding: 0 18px; border: 0; border-radius: 8px; background: var(--accent); color: var(--on-accent); cursor: pointer; font-weight: 700; }
.chat-form button:hover { background: var(--accent-light); }
.chat-note { padding: 0 24px 16px; font-size: 12px; color: var(--muted); }
/* Live data */
.notice { padding: 12px 16px; border-left: 4px solid var(--accent); border-radius: 0 8px 8px 0; background: rgba(240,180,41,.06); color: var(--fg); font-size: 15px; }
.notice.error { border-left-color: var(--red); background: rgba(248,113,113,.07); }
.evlink { font-size: 13px; font-weight: 600; margin-left: 4px; }
details.evheads, details.more { margin-top: 4px; }
details.evheads summary, details.more summary { cursor: pointer; color: var(--accent); font-size: 13px; font-weight: 600; padding: 6px 0; }
details.evheads .hl { padding: 8px 0 8px 10px; border-top: 0; border-left: 2px solid var(--rule); }
details.evheads .hl a { font-size: 14px; }
.msg.bot.err { color: var(--red); }
.btn:disabled { opacity: .6; cursor: progress; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
</style>
</head>

<script>
(function () {
  'use strict';

  // ---------- State ----------
  const state = { page: 'general', region: 'all', tz: 'vie' };
  const PAGES = [['general', 'General'], ['stocks', 'Stocks'], ['commodities', 'Commodities']];
  const REGIONS = [['all', 'All'], ['us', 'US'], ['eu', 'Europe'], ['asia', 'Asia'], ['ru', 'Russia']];
  const TZS = [['vie', 'Vienna'], ['ny', 'New York']];
  const TZ_ID = { vie: 'Europe/Vienna', ny: 'America/New_York' };
  const R_NAME = { us: 'US', eu: 'Europe', asia: 'Asia', ru: 'Russia', global: 'Global' };
  // The API speaks the spec's region names; the filter uses short codes.
  const CODE = { us: 'us', europe: 'eu', asia: 'asia', russia: 'ru', global: 'global' };
  const OVERVIEW_KEY = { all: 'all', us: 'us', eu: 'europe', asia: 'asia', ru: 'russia' };
  const DOTS = { 3: '●●●', 2: '●●○', 1: '●○○' };
  const LEVEL = { 3: 'High', 2: 'Medium', 1: 'Low' };
  const KIND = {
    fed: 'Fed', 'us-data': 'Data', earnings: 'Earnings', 'eu-central-bank': 'Central bank', 'eu-data': 'Data',
    'asia-central-bank': 'Central bank', 'asia-data': 'Data', russia: 'Russia', commodities: 'Commodities'
  };
  const GROUP_WORDS = {
    Agriculture: /\b(soy|soybeans?|corn|wheat|coffee|grains?|crop|harvest|usda|wasde)\b/i,
    Energy: /\b(oil|crude|brent|wti|opec|gas|lng|eia|energy)\b/i,
    Metals: /\b(gold|silver|copper|metals?|aluminium|aluminum)\b/i
  };

  let D = null; // the last /api/news answer
  let loadError = '';
  let notice = '';
  let byId = new Map();

  // ---------- Helpers ----------
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const safeUrl = (u) => (/^https?:\/\//.test(u || '') ? u : '#');
  const keep = (code) => state.region === 'all' || code === state.region || code === 'global';
  const tzLabel = () => (state.tz === 'vie' ? 'Vienna' : 'New York');
  const fmt = (opts) => new Intl.DateTimeFormat('en-GB', Object.assign({ timeZone: TZ_ID[state.tz] }, opts));
  const time = (iso) => fmt({ hour: '2-digit', minute: '2-digit', hourCycle: 'h23' }).format(new Date(iso));
  const dayKey = (ms) => new Intl.DateTimeFormat('en-CA', { timeZone: TZ_ID[state.tz] }).format(new Date(ms));
  const dayLabel = (ms) => fmt({ weekday: 'short', day: 'numeric' }).format(new Date(ms)).replace(',', '');
  const longDate = (ms) => fmt({ weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }).format(new Date(ms)).replace(',', '');
  function ago(iso) {
    const min = Math.max(0, Math.round((Date.now() - Date.parse(iso)) / 60000));
    if (min < 60) return min + ' min ago';
    if (min < 48 * 60) return Math.round(min / 60) + ' h ago';
    return Math.round(min / 1440) + ' d ago';
  }
  function countdown(ms) {
    const min = Math.max(0, Math.round(ms / 60000));
    if (min < 60) return 'in ' + min + ' min';
    if (min < 24 * 60) return 'in ' + Math.floor(min / 60) + ' h ' + String(min % 60).padStart(2, '0') + ' min';
    return 'in ' + Math.round(min / 1440) + ' d';
  }
  const itemSources = (ids) => {
    const out = [];
    ids.forEach((id) => {
      const i = byId.get(id);
      if (!i) return;
      [{ source: i.source, url: i.url }].concat(i.alsoIn || []).forEach((s) => {
        if (!out.some((o) => o.label === s.source)) out.push({ label: s.source, url: s.url });
      });
    });
    return out.slice(0, 5);
  };

  // ---------- View models from the API ----------
  const briefing = () => (D && D.briefing) || null;
  const items = () => (D ? D.items : []);
  const events = () => (D ? D.events : []);

  function stories(page) {
    const b = briefing();
    if (!b) return [];
    return b.pages[page].topStories.map((s) => ({
      title: s.summary, why: s.why, imp: s.importance, isNew: s.status === 'new',
      region: CODE[s.region] || 'global', topic: s.topic, sources: itemSources(s.ids)
    }));
  }

  // This week, Monday to Sunday, in the viewer's time zone; later events in "Later".
  function week(filter) {
    const now = Date.now();
    const todayKey = dayKey(now);
    const wd = new Date(todayKey + 'T12:00:00Z').getUTCDay();
    const monday = Date.parse(todayKey + 'T12:00:00Z') - ((wd + 6) % 7) * 86400000;
    const days = [];
    for (let i = 0; i < 7; i++) {
      const ms = monday + i * 86400000;
      days.push({ key: new Date(ms).toISOString().slice(0, 10), label: dayLabel(ms), today: new Date(ms).toISOString().slice(0, 10) === todayKey, weekend: i >= 5, events: [] });
    }
    const later = { key: 'later', label: 'Later', events: [] };
    events().filter(filter).forEach((e) => {
      const k = dayKey(Date.parse(e.start));
      const d = days.find((x) => x.key === k);
      if (d) d.events.push(e);
      else if (k > days[6].key) later.events.push(e);
    });
    days.concat(later).forEach((d) => d.events.sort((x, y) => x.start.localeCompare(y.start)));
    const list = days.filter((d) => !d.weekend || d.events.length);
    if (later.events.length) list.push(later);
    return list;
  }

  function headlineCats(page) {
    const all = items().slice().sort((a, b) => b.publishedAt.localeCompare(a.publishedAt));
    const earn = /\b(earnings|results|quarter(ly)?|revenue|profit|guidance|eps|outlook)\b/i;
    if (page === 'general') {
      return [
        { name: 'World', items: all.filter((i) => i.category === 'world') },
        { name: 'Economy', items: all.filter((i) => i.category === 'markets') },
        { name: 'Central banks', items: all.filter((i) => i.category === 'policy') }
      ];
    }
    if (page === 'stocks') {
      return [
        { name: 'Markets', items: all.filter((i) => i.category === 'markets' && !earn.test(i.title)) },
        { name: 'Companies', items: all.filter((i) => i.category === 'company' && !earn.test(i.title)) },
        { name: 'Earnings', items: all.filter((i) => (i.category === 'company' || i.category === 'markets') && earn.test(i.title)) }
      ];
    }
    const c = all.filter((i) => i.category === 'commodities');
    const cut = Date.now() - 6 * 3600000;
    return [
      { name: 'Latest', items: c.filter((i) => Date.parse(i.publishedAt) >= cut) },
      { name: 'Earlier', items: c.filter((i) => Date.parse(i.publishedAt) < cut) }
    ];
  }

  // ---------- Render pieces ----------
  const hl = (i) => `<div class="hl"><a href="${esc(safeUrl(i.url))}" target="_blank" rel="noopener">${esc(i.title)}</a><span>${esc(i.source)}${(i.alsoIn || []).length ? ' +' + i.alsoIn.length : ''}, ${esc(ago(i.publishedAt))}, ${R_NAME[CODE[i.region]] || 'Global'}</span></div>`;

  function overview(page, title) {
    const b = briefing();
    const text = b ? b.pages[page].overview[OVERVIEW_KEY[state.region]] || b.pages[page].overview.all : '';
    const meta = b ? `${esc(b.label)}, ${time(b.generatedAt)} ${tzLabel()}` : '';
    const themes = b ? b.pages[page].themes : [];
    return `
    <section class="stack overview" aria-labelledby="ov-h" style="gap:16px">
      <div class="sec-head">
        <h1 class="sec-title" id="ov-h">${esc(title)}</h1>
        <span class="meta">${meta}</span>
      </div>
      <p>${b ? esc(text) : 'The first briefing is being prepared. It is written with the first headline fetch after a deploy, then at 02:30, 08:00, 12:30 and 16:30 New York time.'}</p>
      ${themes.length ? `<div class="themes">${themes.map((x) => `<span>${esc(x)}</span>`).join('')}</div>` : ''}
    </section>`;
  }

  function storyList(page) {
    const s = stories(page).filter((x) => keep(x.region)).slice(0, 5);
    const body = s.length ? s.map((x, i) => `
      <article class="story">
        <div class="rank" aria-hidden="true">${i + 1}</div>
        <div>
          <div class="tags">
            <span class="dots" aria-hidden="true">${DOTS[x.imp]}</span>
            <span class="meta" style="font-size:13px">${LEVEL[x.imp]} importance</span>
            ${x.isNew ? '<span class="tag new">New</span>' : '<span class="tag cont">Continuing</span>'}
            <span class="tag">${R_NAME[x.region]}</span>
            <span class="tag">${esc(x.topic)}</span>
          </div>
          <h3>${esc(x.title)}</h3>
          ${x.why ? `<p class="why"><strong>Why it matters:</strong> ${esc(x.why)}</p>` : ''}
          <div class="src"><span>Sources:</span>${x.sources.map((src) => `<a href="${esc(safeUrl(src.url))}" target="_blank" rel="noopener">${esc(src.label)}</a>`).join('')}</div>
        </div>
      </article>`).join('') : `<p class="empty">${briefing() ? 'No top stories for this region.' : 'Top stories appear with the first briefing.'}</p>`;
    return `<section aria-labelledby="ts-h"><h2 class="small-label" id="ts-h" style="margin-bottom:8px">Top stories</h2>${body}</section>`;
  }

  function eventRow(e) {
    const now = Date.now();
    const live = Date.parse(e.start) <= now && now < Date.parse(e.end);
    const heads = (e.itemIds || []).map((id) => byId.get(id)).filter(Boolean);
    return `<div class="ev"><span class="tm">${time(e.start)}</span><span>
      <span class="nm">${esc(e.title)}</span><span class="r">, ${R_NAME[CODE[e.region]] || 'Global'}</span>${e.result ? `<span class="res">: ${esc(e.result)}</span>` : live ? '<span class="res">: live</span>' : ''}
      ${e.streamUrl && Date.parse(e.end) > now ? ` <a class="evlink" href="${esc(safeUrl(e.streamUrl))}" target="_blank" rel="noopener">${live ? 'Watch live' : 'Stream'}</a>` : ''}
      ${heads.length ? `<details class="evheads"><summary>${heads.length} headline${heads.length > 1 ? 's' : ''}</summary>${heads.map(hl).join('')}</details>` : ''}
    </span></div>`;
  }

  function weekSection(title, filter) {
    const days = week((e) => keep(CODE[e.region] || 'global') && filter(e));
    return `
    <section aria-labelledby="wk-h" id="week">
      <h2 class="side-title" id="wk-h">${esc(title)}</h2>
      ${days.map((d) => `<div class="day">
          <div class="d">${esc(d.label)}${d.today ? ' <span class="today">Today</span>' : ''}</div>
          ${d.events.length ? d.events.map(eventRow).join('') : '<span class="meta">No events for this region</span>'}
        </div>`).join('')}
    </section>`;
  }

  function headlines(title, page, cols) {
    const cats = headlineCats(page);
    let n = 0;
    const colsHtml = cats.map((c) => {
      const list = c.items.filter((h) => keep(CODE[h.region] || 'global'));
      n += list.length;
      const first = list.slice(0, 8), rest = list.slice(8);
      return `<div class="hcol"><h3>${esc(c.name)}</h3>${list.length ? first.map(hl).join('') +
        (rest.length ? `<details class="more"><summary>Show ${rest.length} more</summary>${rest.map(hl).join('')}</details>` : '') : '<p class="empty">Nothing for this region</p>'}</div>`;
    }).join('');
    return `<section class="headlines" id="headlines" aria-labelledby="hl-h">
      <div class="sec-head"><h2 class="sec-title" id="hl-h">${esc(title)}</h2><span class="meta">${n} headlines from the last 24 hours, newest first</span></div>
      <div class="hgrid c${cols}">${colsHtml}</div>
    </section>`;
  }

  function strip() {
    const now = Date.now();
    const evs = events().filter((e) => keep(CODE[e.region] || 'global'));
    const onNow = evs.filter((e) => Date.parse(e.start) <= now && now < Date.parse(e.end)).sort((a, b) => b.importance - a.importance).slice(0, 2);
    const next = evs.filter((e) => Date.parse(e.start) > now).slice(0, 3);
    return `
      <div class="live">
        <div class="small-label"><svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><circle cx="5" cy="5" r="5" fill="#F87171"/></svg>On now</div>
        ${onNow.length ? onNow.map((e) => `
          <div class="title">${esc(e.title)}</div>
          <div class="sub">${R_NAME[CODE[e.region]] || 'Global'}, started ${time(e.start)}, until about ${time(e.end)}</div>
          ${e.streamUrl ? `<a href="${esc(safeUrl(e.streamUrl))}" target="_blank" rel="noopener">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M7 4l13 8-13 8z"/></svg>
            Watch live
          </a>` : ''}`).join('') : '<div class="none">Nothing live right now for this region.</div>'}
      </div>
      <div class="panel" style="display:flex;flex-direction:column;gap:16px;padding:24px 28px">
        <div class="sec-head"><span class="small-label">Next up</span><a href="#week" style="font-size:14px;font-weight:600">Full week</a></div>
        ${next.length ? `<div class="next">${next.map((e) => `
          <div><div class="row"><span>${time(e.start)}</span><span class="cd">${countdown(Date.parse(e.start) - now)}</span></div>
          <div class="t">${esc(e.title)}</div><div class="meta" style="font-size:13px">${esc(KIND[e.type] || 'Event')}, ${R_NAME[CODE[e.region]] || 'Global'}</div></div>`).join('')}</div>` : '<p class="meta">No more events scheduled for this region.</p>'}
      </div>`;
  }

  // ---------- Pages ----------
  function renderGeneral() {
    const b = briefing();
    const elsewhere = b ? [
      ...b.pages.stocks.topStories.slice(0, 3).map((s) => ({ page: 'stocks', title: s.summary, region: CODE[s.region] || 'global' })),
      ...b.pages.commodities.topStories.slice(0, 3).map((s) => ({ page: 'commodities', title: s.summary, region: CODE[s.region] || 'global' }))
    ].filter((x) => keep(x.region)).slice(0, 4) : [];
    return `
      <div class="stack" style="gap:40px">
        <section class="strip" id="strip" aria-label="Calendar">${strip()}</section>
        <div class="cols">
          <div class="stack">${overview('general', 'The day so far')}${storyList('general')}</div>
          <aside class="stack">
            <section class="panel elsewhere" aria-labelledby="el-h">
              <h2 class="side-title" id="el-h">Elsewhere today</h2>
              ${elsewhere.length ? elsewhere.map((x) => `<div class="item"><span class="small-label" style="font-size:12px">${x.page === 'stocks' ? 'Stocks' : 'Commodities'}</span><a href="#${x.page}">${esc(x.title)}</a></div>`).join('') : '<p class="empty">Nothing for this region.</p>'}
            </section>
            ${weekSection('This week', (e) => e.type !== 'earnings' && e.type !== 'commodities')}
          </aside>
        </div>
        ${headlines('Headlines', 'general', 3)}
      </div>`;
  }

  function renderStocks() {
    const b = briefing();
    const companies = b ? b.companies : [];
    const regionOf = (t) => CODE[((D.watchlist || []).find((w) => w.symbol === t) || {}).region] || 'us';
    const shown = companies.filter((c) => c.line && keep(regionOf(c.ticker)));
    const hidden = companies.filter((c) => c.line && !keep(regionOf(c.ticker))).map((c) => c.ticker);
    const quiet = companies.filter((c) => !c.line).map((c) => c.ticker);
    const note = !D.yahooOk ? 'Company news from Yahoo is unavailable right now; these lines come from the other feeds.'
      : (hidden.length ? hidden.join(', ') + ' hidden by the region filter. ' : '') + (quiet.length ? quiet.join(', ') + ': nothing notable today.' : '');
    return `
      <div class="stack" style="gap:40px">
        <div class="cols">
          <div class="stack">${overview('stocks', 'Stocks today')}${storyList('stocks')}</div>
          <aside class="stack">
            <section class="panel" aria-labelledby="co-h">
              <h2 class="side-title" id="co-h">My companies</h2>
              ${shown.length ? shown.map((c) => `<div class="line-row"><span class="k">${esc(c.ticker)}</span><span>${esc(c.line)}</span></div>`).join('') : `<p class="empty">${b ? 'No watchlist news in this region.' : 'Company lines appear with the first briefing.'}</p>`}
              ${note ? `<div class="note">${esc(note)}</div>` : ''}
            </section>
            ${weekSection('Earnings calendar', (e) => e.type === 'earnings')}
          </aside>
        </div>
        ${headlines('Stock headlines', 'stocks', 3)}
      </div>`;
  }

  function renderCommodities() {
    const b = briefing();
    const now = Date.now();
    const groups = b ? b.commodityGroups : ['Agriculture', 'Energy', 'Metals'].map((name) => ({ name, summary: '', ids: [], rows: [], nextEventId: null }));
    const commodityItems = items().filter((i) => i.category === 'commodities');
    return `
      <div class="stack" style="gap:40px">
        ${overview('commodities', 'Commodities today')}
        <section class="groups" aria-label="Commodity groups">
          ${groups.map((g) => {
            const own = g.ids.map((id) => byId.get(id)).filter(Boolean);
            const more = commodityItems.filter((i) => GROUP_WORDS[g.name].test(i.title) && !g.ids.includes(i.id));
            const list = own.concat(more).filter((h) => keep(CODE[h.region] || 'global')).slice(0, 4);
            const next = events().find((e) => e.id === g.nextEventId && Date.parse(e.start) > now) ||
              events().find((e) => e.type === 'commodities' && Date.parse(e.start) > now && GROUP_WORDS[g.name].test(e.title));
            return `<div class="panel group">
              <h2>${esc(g.name)}</h2>
              <p class="sum">${esc(g.summary || (b ? 'No notable news today.' : 'The summary appears with the first briefing.'))}</p>
              ${g.rows.length ? `<div>${g.rows.map((r) => `<div class="line-row" style="grid-template-columns:110px minmax(0,1fr)"><span class="k">${esc(r.name)}</span><span>${esc(r.line || 'No notable news today')}</span></div>`).join('')}</div>` : ''}
              <div>
                <div class="small-label" style="font-size:12px;padding-bottom:4px">Headlines</div>
                ${list.length ? list.map(hl).join('') : '<p class="empty">Nothing for this region</p>'}
              </div>
              ${next ? `<div class="nextbox"><span class="small-label">Next</span><b>${esc(next.title)}, ${esc(dayLabel(Date.parse(next.start)))} ${time(next.start)}</b></div>` : ''}
            </div>`;
          }).join('')}
        </section>
        <div class="cols rev">
          ${weekSection('Commodity calendar', (e) => e.type === 'commodities')}
          <div>${headlines('Commodity headlines', 'commodities', 2)}</div>
        </div>
      </div>`;
  }

  // ---------- Chrome ----------
  function renderChrome() {
    const b = briefing();
    const parts = [];
    if (b) parts.push(`Briefing ${time(b.generatedAt)}`);
    if (D && D.fetchedAt) parts.push(`headlines ${time(D.fetchedAt)}`);
    document.getElementById('updated').textContent = parts.length ? `${parts.join(' · ')} ${tzLabel()}` : '';
    document.getElementById('today').textContent = longDate(Date.now());
    document.getElementById('tz').innerHTML = TZS.map(([id, label]) =>
      `<button type="button" data-tz="${id}" aria-pressed="${state.tz === id}">${label}</button>`).join('');
    document.getElementById('regions').innerHTML = REGIONS.map(([id, label]) =>
      `<button type="button" data-region="${id}" aria-pressed="${state.region === id}">${label}</button>`).join('');
    document.getElementById('tabs').innerHTML = PAGES.map(([id, label]) =>
      `<a href="#${id}"${state.page === id ? ' aria-current="page"' : ''}>${label}</a>`).join('');
  }

  function render() {
    renderChrome();
    const main = document.getElementById('page');
    const open = [...main.querySelectorAll('details[open]')].map((d) => d.dataset.key || d.querySelector('summary').textContent);
    let html = '';
    if (notice) html += `<p class="notice" role="status">${esc(notice)}</p>`;
    if (!D) {
      html += loadError ? `<p class="notice error">${esc(loadError)}</p>` : '<p class="meta" style="padding:24px 0">Loading today’s briefing…</p>';
    } else {
      html += ({ general: renderGeneral, stocks: renderStocks, commodities: renderCommodities })[state.page]();
      if (D.stale && D.stale.length) html += `<p class="meta">No headlines for a day from: ${esc(D.stale.join(', '))}.</p>`;
    }
    main.innerHTML = html;
    main.querySelectorAll('details').forEach((d) => { if (open.includes(d.querySelector('summary').textContent)) d.open = true; });
    document.title = `Market News – ${PAGES.find((p) => p[0] === state.page)[1]}`;
    if (chat.open) renderSuggest();
  }

  // ---------- Data ----------
  async function load() {
    try {
      const res = await fetch('/api/news', { cache: 'no-cache' });
      if (!res.ok) throw new Error('status ' + res.status);
      D = await res.json();
      byId = new Map(D.items.map((i) => [i.id, i]));
      loadError = '';
    } catch (err) {
      if (!D) loadError = 'Market News could not be loaded (' + err.message + '). Check the connection and press Refresh.';
    }
    render();
  }

  // ---------- Chat ----------
  const CHAT_ENDPOINT = '/api/chat';
  const SUGGEST = {
    general: ['What happened today?', 'Did the Fed decide anything this week?', 'What is going on with Russia?'],
    stocks: ['Why are chip stocks moving?', 'Anything new on my companies?', 'Which earnings are coming up?'],
    commodities: ['What is moving oil?', 'Why are soybeans moving?', 'What is next on the commodity calendar?']
  };

  const chat = { open: false, messages: [], remaining: null };
  const chatEl = document.getElementById('chat');
  const logEl = document.getElementById('chat-log');
  const inputEl = document.getElementById('chat-input');
  const askBtn = document.getElementById('ask');

  function renderSuggest() {
    const page = PAGES.find((p) => p[0] === state.page)[1];
    document.getElementById('chat-context').textContent = `Knows today’s headlines, calendar and results · on ${page}, region ${REGIONS.find((r) => r[0] === state.region)[1]}`;
    document.getElementById('chat-suggest').innerHTML = chat.messages.length > 6 ? '' :
      SUGGEST[state.page].map((q) => `<button type="button" data-ask="${esc(q)}">${esc(q)}</button>`).join('');
    document.getElementById('chat-note').textContent = 'Answers come from the collected headlines and may miss context. Not investment advice.' +
      (chat.remaining != null ? ` ${chat.remaining} question${chat.remaining === 1 ? '' : 's'} left today.` : '');
  }

  function renderLog() {
    logEl.innerHTML = chat.messages.length ? chat.messages.map((m) => {
      if (m.role === 'user') return `<div class="msg user">${esc(m.text)}</div>`;
      if (m.pending) return '<div class="msg bot pending">Reading today’s headlines…</div>';
      const paras = String(m.text).split(/\n{2,}/).map((p) => `<p>${esc(p)}</p>`).join('');
      const srcs = (m.sources || []).map((s) => `<a href="${esc(safeUrl(s.url))}" target="_blank" rel="noopener">${esc(s.label)}</a>`).join('');
      return `<div class="msg bot${m.error ? ' err' : ''}">${paras}${srcs ? `<div class="srcs">${srcs}</div>` : ''}</div>`;
    }).join('') : '<div class="msg bot"><p>Ask me about today’s news, markets, commodities or upcoming events. I answer from the headlines, calendar and results this app has collected.</p></div>';
    logEl.scrollTop = logEl.scrollHeight;
  }

  async function answer() {
    const res = await fetch(CHAT_ENDPOINT, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'same-origin',
      body: JSON.stringify({
        messages: chat.messages.filter((m) => !m.pending && !m.error).map((m) => ({ role: m.role, content: m.text })),
        page: state.page, region: state.region, tz: state.tz
      })
    });
    const data = await res.json().catch(() => ({}));
    if (res.status === 401) { setUser(null); throw new Error('Your session has ended. Sign in again to keep asking.'); }
    if (typeof data.remaining === 'number') chat.remaining = data.remaining;
    if (!res.ok) throw new Error(data.error || 'The answer could not be loaded (status ' + res.status + ').');
    return { text: data.answer, sources: data.sources || [] };
  }

  async function send(question) {
    const q = question.trim();
    if (!q || chat.messages.some((m) => m.pending)) return;
    chat.messages.push({ role: 'user', text: q });
    const pending = { role: 'assistant', pending: true };
    chat.messages.push(pending);
    renderLog(); renderSuggest();
    try {
      const a = await answer();
      Object.assign(pending, { pending: false, text: a.text, sources: a.sources });
    } catch (err) {
      Object.assign(pending, { pending: false, error: true, text: err.message });
    }
    renderLog(); renderSuggest();
  }

  function setChat(open) {
    chat.open = open;
    chatEl.hidden = !open;
    askBtn.setAttribute('aria-expanded', String(open));
    if (open) { renderSuggest(); renderLog(); inputEl.focus(); } else { askBtn.focus(); }
  }

  // ---------- Sign-in ----------
  // AI features (the chat, and a fresh briefing on Refresh) are for signed-in
  // users; the Worker refuses both without a session before any model call.
  // Everyone can read the scheduled briefing, the calendar and the headlines.
  const session = { user: null };
  const accountEl = document.getElementById('account');
  const refreshBtn = document.getElementById('refresh');
  const BQE = window.BQE;

  function setUser(user) {
    session.user = user;
    document.body.classList.toggle('guest', !user);
    askBtn.title = user ? '' : 'Sign in to ask AI';
    askBtn.setAttribute('aria-label', user ? 'Ask AI' : 'Ask AI (sign in required)');
    refreshBtn.title = user ? 'Fetch headlines and build a fresh briefing' : 'Reload the latest briefing. Signed-in users can build a fresh one.';
    accountEl.classList.toggle('is-user', !!user);
    accountEl.innerHTML = '<span class="dot" aria-hidden="true"></span><span class="who"></span><button type="button"></button>';
    accountEl.querySelector('.who').textContent = user ? user.username : 'Guest';
    accountEl.querySelector('button').textContent = user ? 'Sign out' : 'Sign in';
    if (!user && chat.open) setChat(false);
  }

  async function signIn(note) {
    if (!BQE) return null;
    const user = await BQE.openLogin({ note });
    if (user) setUser(user);
    return user;
  }

  accountEl.addEventListener('click', async (e) => {
    if (!e.target.closest('button')) return;
    if (session.user) { await BQE.logout(); setUser(null); chat.messages = []; chat.remaining = null; }
    else await signIn('Signing in unlocks Ask AI and fresh briefings.');
  });

  askBtn.addEventListener('click', async () => {
    if (!session.user && !(await signIn('Ask AI is for signed-in users.'))) return;
    setChat(!chat.open);
  });
  document.getElementById('chat-close').addEventListener('click', () => setChat(false));
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && chat.open) setChat(false); });
  document.getElementById('chat-form').addEventListener('submit', (e) => {
    e.preventDefault();
    const q = inputEl.value;
    inputEl.value = '';
    send(q);
  });
  inputEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); document.getElementById('chat-form').requestSubmit(); }
  });
  document.getElementById('chat-suggest').addEventListener('click', (e) => {
    const b = e.target.closest('[data-ask]');
    if (b) send(b.dataset.ask);
  });

  // ---------- Events ----------
  document.addEventListener('click', (e) => {
    const r = e.target.closest('[data-region]');
    if (r) { state.region = r.dataset.region; render(); return; }
    const z = e.target.closest('[data-tz]');
    if (z) { state.tz = z.dataset.tz; render(); }
  });

  // Page routing via the URL hash; in-page anchors (#week, #headlines) keep the current page.
  function route() {
    const h = location.hash.replace('#', '');
    if (PAGES.some((p) => p[0] === h)) {
      state.page = h;
      render();
      window.scrollTo(0, 0);
    }
  }
  window.addEventListener('hashchange', route);

  // A guest's Refresh re-reads the stored briefing. A signed-in user's asks
  // the Worker to fetch and write a new one (at most one per 15 minutes).
  refreshBtn.addEventListener('click', async () => {
    notice = '';
    if (session.user) {
      refreshBtn.disabled = true;
      notice = 'Fetching headlines and writing a fresh briefing…';
      render();
      try {
        const res = await fetch('/api/news/refresh', { method: 'POST', credentials: 'same-origin' });
        const data = await res.json().catch(() => ({}));
        if (res.status === 401) setUser(null);
        notice = res.ok ? '' : (data.error || 'The briefing could not be refreshed.') + ' Showing the latest one.';
      } catch (err) {
        notice = 'The briefing could not be refreshed. Showing the latest one.';
      }
      refreshBtn.disabled = false;
    }
    await load();
  });

  // Countdowns and "On now" move with the clock; the data is re-read every 5 minutes.
  setInterval(() => { const s = document.getElementById('strip'); if (s && D) s.innerHTML = strip(); }, 30000);
  setInterval(load, 5 * 60000);

  setUser(null);
  if (BQE) BQE.user.then(setUser);
  route();
  render();
  load();
})();
</script>
</body>
</html>
