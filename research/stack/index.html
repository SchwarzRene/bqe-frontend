<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stack — four timeframes, one scroll</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box}

:root{
  box-sizing:border-box;
  height:100%;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light dark;

  --bg:#e9edf3;
  --pane:#ffffff;
  --rule:#cfd8e4;
  --grid:#e2e8f0;
  --fg:#101a27;
  --muted:#5d6f88;
  --up:#17a34a;
  --down:#c23b4b;
  --mark:#b06a00;
  --markSoft:rgba(176,106,0,.14);
  --focus:#2f6fd0;
  --focusSoft:rgba(47,111,208,.13);
  --chrome:#f6f8fb;
  --shadow:rgba(16,26,39,.10);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#080d16;
    --pane:#0f1826;
    --rule:#1d2a3c;
    --grid:#182435;
    --fg:#dfe8f4;
    --muted:#7d90a9;
    --up:#3fbf62;
    --down:#f0616f;
    --mark:#f5b53f;
    --markSoft:rgba(245,181,63,.16);
    --focus:#62a8ff;
    --focusSoft:rgba(98,168,255,.17);
    --chrome:#0b1320;
    --shadow:rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --bg:#080d16;
  --pane:#0f1826;
  --rule:#1d2a3c;
  --grid:#182435;
  --fg:#dfe8f4;
  --muted:#7d90a9;
  --up:#3fbf62;
  --down:#f0616f;
  --mark:#f5b53f;
  --markSoft:rgba(245,181,63,.16);
  --focus:#62a8ff;
  --focusSoft:rgba(98,168,255,.17);
  --chrome:#0b1320;
  --shadow:rgba(0,0,0,.5);
}

html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  height:100%;margin:0;overflow:hidden;
  background:var(--bg);color:var(--fg);
  font-family:'Archivo','Helvetica Neue',Arial,sans-serif;
  font-variant-numeric:tabular-nums;
  -webkit-text-size-adjust:100%;
  display:flex;flex-direction:column;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--mark);outline-offset:2px}

/* ---------- chrome ---------- */
.bar{
  flex:0 0 auto;display:flex;align-items:center;gap:10px;
  padding:0 12px;height:46px;background:var(--chrome);
  border-bottom:1px solid var(--rule);
}
.wordmark{
  font-weight:800;font-stretch:125%;letter-spacing:.02em;font-size:19px;
}
.wordmark i{font-style:normal;color:var(--mark)}
a.wordmark{color:inherit;text-decoration:none;white-space:nowrap}
.wordmark .back{display:inline-block;margin-inline-end:6px;font-weight:500;font-stretch:100%;font-size:16px;color:var(--muted);transition:color .15s,transform .15s}
a.wordmark:hover .back,a.wordmark:focus-visible .back{color:var(--mark);transform:translateX(-2px)}
.count{color:var(--muted);font-size:12.5px}
.src{
  margin-inline-start:auto;font-size:10.5px;color:var(--muted);
  border:1px solid var(--rule);border-radius:999px;padding:3px 8px;white-space:nowrap;
}
.src.live{color:var(--up);border-color:var(--up)}
.acct{color:var(--muted);white-space:nowrap}
@media (max-width:560px){ .acct .bqe-label{display:none} }
/* Phones: the bar is two rows — back link, account and buttons first, the
   data source and position below — instead of one row that pushes buttons
   off the screen. The feed below takes whatever height is left. */
@media (max-width:520px){
  .bar{flex-wrap:wrap;height:auto;min-height:46px;padding:6px 10px;gap:6px 8px}
  .bar::before{content:"";order:3;flex-basis:100%;height:0}
  .acct{order:1;margin-inline-start:auto}
  .bar .iconbtn{order:2;flex:0 0 auto}
  .src{order:4;margin-inline-start:0}
  .count{order:5;white-space:nowrap}
}
@media (max-width:360px){
  .bar{padding:6px 8px;column-gap:5px}
  .bar .iconbtn{width:30px}
  .wordmark{font-size:17px}
}
.iconbtn{
  width:34px;height:30px;border:1px solid var(--rule);border-radius:7px;
  display:grid;place-items:center;color:var(--muted);background:var(--pane);
}
.iconbtn[aria-pressed="true"]{color:var(--mark);border-color:var(--mark);background:var(--markSoft)}
.iconbtn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

.filters{
  flex:0 0 auto;display:none;gap:8px;padding:9px 12px;background:var(--chrome);
  border-bottom:1px solid var(--rule);
}
.filters.open{display:flex}
.filters input,.filters select{
  font:inherit;font-size:13.5px;color:var(--fg);background:var(--pane);
  border:1px solid var(--rule);border-radius:7px;padding:7px 9px;min-width:0;
}
.filters input{flex:1 1 auto}
.filters select{flex:0 1 44%}

/* ---------- marked charts, one swipe to the left of the feed ---------- */
#saved{
  position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column;
  transform:translateX(-100%);transition:transform .26s ease;will-change:transform;
  touch-action:pan-y;overscroll-behavior:contain;
}
#saved.open{transform:none}
@media (prefers-reduced-motion:reduce){#saved{transition:none}}
.sv-head{
  flex:0 0 auto;display:flex;align-items:center;gap:10px;
  padding:calc(env(safe-area-inset-top,0px) + 12px) 14px 12px;
  border-bottom:1px solid var(--rule);background:var(--chrome);
}
.sv-head h2{margin:0;font-size:17px;font-weight:800;font-stretch:112%;letter-spacing:-.01em}
.sv-n{font-size:12px;color:var(--muted)}
.sv-head .iconbtn{margin-inline-start:auto}
.sv-list{flex:1 1 auto;min-height:0;overflow-y:auto;padding:8px 10px 24px}
.sv-row{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  background:var(--pane);border:1px solid var(--rule);border-radius:10px;
  padding:10px 12px;margin-bottom:8px;color:var(--fg);font:inherit;cursor:pointer;
}
.sv-row:hover{border-color:var(--focus)}
.sv-id{min-width:0;flex:1 1 auto}
.sv-sym{display:block;font-size:17px;font-weight:800;font-stretch:112%;line-height:1.1}
.sv-nm{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sv-lines{display:block;font-size:10.5px;color:var(--mark);margin-top:1px}
.sv-spark{flex:0 0 auto;width:96px;height:34px;display:block}
.sv-q{flex:0 0 auto;text-align:right;line-height:1.2}
.sv-px{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}
.sv-chg{font-size:12px;font-variant-numeric:tabular-nums}
.sv-drop{
  flex:0 0 auto;background:none;border:0;color:var(--muted);cursor:pointer;
  font:inherit;font-size:18px;line-height:1;padding:4px 2px;
}
.sv-drop:hover{color:var(--down)}
.sv-item{margin-bottom:10px}
.sv-item .sv-row{margin-bottom:0;border-radius:10px 10px 0 0;border-bottom:0}
.sv-th{
  background:var(--chrome);border:1px solid var(--rule);border-top:0;
  border-radius:0 0 10px 10px;padding:8px 12px 10px;
}
.sv-th-text{margin:0 0 6px;font-size:13px;line-height:1.55;white-space:pre-wrap;color:var(--fg)}
.sv-th-when{font-size:10.5px;color:var(--muted)}
.sv-th-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sv-th-btn{
  background:none;border:0;padding:2px 0;font:inherit;font-size:12px;font-weight:600;
  color:var(--focus);cursor:pointer;
}
.sv-th-btn.danger{color:var(--down)}
.sv-th-btn:hover{text-decoration:underline}
.sv-th textarea{
  width:100%;box-sizing:border-box;font:inherit;font-size:13px;line-height:1.5;
  color:var(--fg);background:var(--pane);border:1px solid var(--rule);border-radius:8px;
  padding:8px 10px;min-height:86px;resize:vertical;
}
.sv-th textarea:focus{outline:2px solid var(--focus);outline-offset:1px}
.sv-empty{padding:40px 22px;text-align:center;color:var(--muted);font-size:14px;line-height:1.6}
.sv-hint{padding:4px 4px 14px;text-align:center;color:var(--muted);font-size:11.5px}

/* ---------- feed ---------- */
#feed{
  flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;
  scroll-snap-type:y mandatory;overscroll-behavior-y:contain;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:none;
}
#feed::-webkit-scrollbar{display:none}
.card{
  height:100%;scroll-snap-align:start;scroll-snap-stop:always;
  display:flex;flex-direction:column;padding:8px 8px 10px;
}
.slide{flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
.chd{flex:0 0 auto;display:flex;align-items:baseline;gap:9px;padding:2px 4px 8px}
.sym{font-size:27px;font-weight:800;font-stretch:118%;letter-spacing:-.01em;line-height:1}
.meta{min-width:0;display:flex;flex-direction:column;gap:1px;line-height:1.15}
.nm{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:38vw}
.sec{font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:38vw}
.quote{margin-inline-start:auto;text-align:right;line-height:1.15}
.px{display:block;font-size:17px;font-weight:600}
.chg{display:block;font-size:12px;font-weight:600}
.chg.pos{color:var(--up)} .chg.neg{color:var(--down)}
.star{width:30px;height:30px;display:grid;place-items:center;color:var(--muted);align-self:center}
.star svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linejoin:round}
.star[aria-pressed="true"]{color:var(--mark)}
.star[aria-pressed="true"] svg{fill:currentColor}

.panes{flex:1 1 auto;min-height:0;display:grid;grid-template-rows:repeat(4,1fr);gap:6px}
.pane{
  position:relative;background:var(--pane);border:1px solid var(--rule);border-radius:9px;
  overflow:hidden;cursor:zoom-in;touch-action:pan-y;contain:layout paint;
}
.pane canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.paxis{
  position:absolute;top:0;right:0;width:46px;height:100%;z-index:2;
  touch-action:none;cursor:ns-resize;background:transparent;
}
.tfl{
  position:absolute;top:5px;left:8px;font-size:10px;font-weight:700;letter-spacing:.06em;
  color:var(--muted);pointer-events:none;
}
.marked{position:absolute;top:5px;right:52px;font-size:10px;color:var(--mark);pointer-events:none}

.empty{padding:40px 24px;color:var(--muted);text-align:center;font-size:14px;line-height:1.5}

/* ---------- fullscreen ---------- */
#fs{
  position:fixed;inset:0;z-index:20;background:var(--bg);
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  display:flex;flex-direction:column;
}
#fs[hidden]{display:none}
.fs-top{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--rule);background:var(--chrome)}
.fs-sym{font-size:18px;font-weight:800;font-stretch:118%}
.fs-nm{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:30vw}
.tabs{margin-inline-start:auto;display:flex;border:1px solid var(--rule);border-radius:8px;overflow:hidden;background:var(--pane)}
.tabs button{padding:6px 10px;font-size:12px;font-weight:600;color:var(--muted);border-right:1px solid var(--rule)}
.tabs button:last-child{border-right:0}
.tabs button[aria-pressed="true"]{background:var(--fg);color:var(--pane)}
.fs-body{flex:1 1 auto;min-height:0;position:relative;margin:6px;background:var(--pane);border:1px solid var(--rule);border-radius:10px;overflow:hidden}
.fs-body canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hint{
  position:absolute;left:10px;bottom:8px;font-size:10.5px;color:var(--muted);
  pointer-events:none;max-width:70%;
}
.fs-tools{flex:0 0 auto;display:flex;gap:6px;padding:0 8px 8px;align-items:center;overflow-x:auto;scrollbar-width:none}
.fs-tools::-webkit-scrollbar{display:none}
.tool{
  padding:9px 12px;border:1px solid var(--rule);border-radius:8px;background:var(--pane);
  font-size:12.5px;font-weight:600;white-space:nowrap;color:var(--muted);
}
.tool[aria-pressed="true"]{background:var(--markSoft);border-color:var(--mark);color:var(--mark)}
.tool.ghost{color:var(--muted)}

/* ---------- toast ---------- */
#toast{
  position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(22px + env(safe-area-inset-bottom,0px));z-index:40;
  background:var(--fg);color:var(--bg);border-radius:9px;
  padding:10px 12px;font-size:13px;display:flex;gap:12px;align-items:center;
  box-shadow:0 8px 24px var(--shadow);
}
#toast[hidden]{display:none}
#toast button{font-weight:700;color:var(--mark)}

/* the card being scrolled to lifts into place; the one leaving settles back.
   Driven by the scroll position itself, so it tracks a finger exactly. */
@media (prefers-reduced-motion:no-preference){
  @supports (animation-timeline: view()){
    .slide{
      animation:slideIn linear both;
      animation-timeline:view(block);
      animation-range:cover 0% cover 100%;
    }
    @keyframes slideIn{
      0%       {opacity:0;transform:scale(.90) translateY(7%)}
      38%, 62% {opacity:1;transform:none}
      100%     {opacity:0;transform:scale(.90) translateY(-7%)}
    }
  }
  @supports not (animation-timeline: view()){
    .card{animation:fadeIn .32s ease-out both}
    @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  }
}
</style>
</head>
<body>
<script src="/assets/js/session.js"></script>

<div class="bar">
  <!-- Back to the Research overview, as the Trading Journal's logo and Market News's "← Research" do. -->
  <a class="wordmark" href="/research/" title="Back to Research" aria-label="Stack — back to Research"><span class="back" aria-hidden="true">←</span>Stack<i>.</i></a>
  <span class="src" id="src">Simulated prices</span>
  <div class="count" id="count"></div>
  <span id="account" class="acct"></span>
  <button class="iconbtn" id="locBtn" aria-pressed="false" aria-label="Show where the faster charts sit">
    <svg viewBox="0 0 24 24"><path d="M9 4v16M15 4v16"/><path d="M4 4h16v16H4z" opacity=".45"/></svg>
  </button>
  <button class="iconbtn" id="markedBtn" aria-label="Marked charts">
    <svg viewBox="0 0 24 24"><path d="M7 3h10a1 1 0 0 1 1 1v17l-6-4-6 4V4a1 1 0 0 1 1-1z"/></svg>
  </button>
  <button class="iconbtn" id="filterBtn" aria-pressed="false" aria-label="Filter the feed">
    <svg viewBox="0 0 24 24"><path d="M3 5h18M6 12h12M10 19h4"/></svg>
  </button>
  <button class="iconbtn" id="themeBtn" aria-label="Switch light or dark">
    <svg viewBox="0 0 24 24"><path d="M12 3v2M12 19v2M5 12H3M21 12h-2M6 6 4.5 4.5M19.5 19.5 18 18M18 6l1.5-1.5M4.5 19.5 6 18"/><circle cx="12" cy="12" r="3.6"/></svg>
  </button>
</div>

<div class="filters" id="filters">
  <input id="q" type="search" placeholder="Find a ticker or company" autocomplete="off" spellcheck="false">
  <select id="sector"><option value="">All sectors</option></select>
  <button class="iconbtn" id="savedBtn" aria-pressed="false" aria-label="Show only saved charts">
    <svg viewBox="0 0 24 24"><path d="M7 3h10a1 1 0 0 1 1 1v17l-6-4-6 4V4a1 1 0 0 1 1-1z"/></svg>
  </button>
</div>

<main id="feed"></main>

<aside id="saved" aria-hidden="true" aria-label="Marked charts">
  <div class="sv-head">
    <h2>Marked charts</h2>
    <span class="sv-n" id="svN"></span>
    <button class="iconbtn" id="svBack" aria-label="Back to the feed">
      <svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>
    </button>
  </div>
  <div class="sv-list" id="svList"></div>
</aside>

<div id="fs" hidden>
  <div class="fs-top">
    <button class="iconbtn" id="fsBack" aria-label="Back to the feed">
      <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <div>
      <div class="fs-sym" id="fsSym">—</div>
      <div class="fs-nm" id="fsNm"></div>
    </div>
    <div class="tabs" id="fsTabs"></div>
  </div>
  <div class="fs-body">
    <canvas id="fsCanvas"></canvas>
    <div class="hint" id="fsHint"></div>
  </div>
  <div class="fs-tools">
    <button class="tool" data-tool="level" aria-pressed="false">Price line</button>
    <button class="tool" data-tool="trend" aria-pressed="false">Trend line</button>
    <button class="tool" data-tool="erase" aria-pressed="false">Erase</button>
    <button class="tool ghost" id="fsClear">Clear lines</button>
    <button class="tool ghost" id="fsLoc">Show ranges</button>
    <button class="tool ghost" id="fsFit">Reset zoom</button>
    <button class="tool ghost" id="fsStar">Save chart</button>
    <button class="tool ghost" id="fsPng" hidden>Export PNG</button>
  </div>
</div>

<div id="toast" hidden><span id="toastMsg"></span><button id="toastAct" hidden></button></div>

<script src="/research/stack/stack.js"></script>
</body>
</html>
