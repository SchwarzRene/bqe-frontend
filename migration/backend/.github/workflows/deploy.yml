name: Deploy to Azure

# Push to main -> test -> build image -> push to GHCR -> roll out on
# Azure Container Apps. Nothing is deployed that has not passed CI first.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".github/workflows/market-*.yml"
  workflow_dispatch:

# id-token is what lets azure/login authenticate with OIDC instead of a
# stored password. See docs/SECRETS.md — there is no Azure secret to leak.
permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: deploy-production
  cancel-in-progress: false      # never interrupt a rollout in flight

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # issued per run, expires with it

      - name: Work out the tags
        id: meta
        run: |
          # The commit SHA is the real tag: it is what the Container App is
          # pinned to, so every revision maps to exactly one commit. :latest
          # is a convenience for pulling by hand, never for deploying.
          echo "image=${IMAGE,,}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "latest=${IMAGE,,}:latest" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ steps.meta.outputs.latest }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false     # Container Apps does not read the attestation

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ steps.rollout.outputs.url }}
    steps:
      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Roll out the new revision
        id: rollout
        env:
          APP: ${{ vars.AZURE_CONTAINER_APP || 'bqe-backend' }}
          GROUP: ${{ vars.AZURE_RESOURCE_GROUP || 'bqe-rg' }}
        run: |
          set -euo pipefail
          az containerapp update \
            --name "$APP" \
            --resource-group "$GROUP" \
            --image "${{ needs.build.outputs.image }}" \
            --output none

          fqdn=$(az containerapp show --name "$APP" --resource-group "$GROUP" \
                   --query properties.configuration.ingress.fqdn -o tsv)
          echo "url=https://$fqdn" >> "$GITHUB_OUTPUT"
          echo "deployed to https://$fqdn"

      - name: Wait for the new revision to answer
        run: |
          set -euo pipefail
          url="${{ steps.rollout.outputs.url }}/healthz"
          # The app scales to zero, so the first request also pays the cold
          # start. Two minutes is generous for both.
          for attempt in $(seq 1 24); do
            if curl -fsS --max-time 10 "$url"; then
              echo "\nhealthy on attempt $attempt"
              exit 0
            fi
            echo "attempt $attempt: not ready yet"
            sleep 5
          done
          echo "::error::the new revision never answered /healthz"
          exit 1
