name: Market tape

# Twice on weekdays: 12:10 UTC (before the US open, picks up the day's
# schedule) and 22:10 UTC (after the close, picks up the numbers).
# Also runnable by hand from the Actions tab.
on:
  schedule:
    - cron: "10 12 * * 1-5"
    - cron: "10 22 * * 1-5"
  workflow_dispatch:
    inputs:
      tickers:
        description: "Earnings watchlist (space separated)"
        required: false
        default: "NVDA AAPL MSFT AMZN GOOGL"

permissions:
  contents: read

concurrency:
  group: market-tape
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the scripts
        uses: actions/checkout@v4

      - name: Check out the site
        uses: actions/checkout@v4
        with:
          repository: SchwarzRene/bqe-frontend
          path: frontend
          token: ${{ secrets.FRONTEND_REPO_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-automation.txt

      - run: pip install -r requirements-automation.txt

      - name: Build the rundown
        env:
          # The only third-party API key in this repo. It is read from the
          # environment by the script and never written to a file.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python automation/scripts/fetch_market_tape.py \
            --out frontend/research/markettape/data \
            --tickers ${{ github.event.inputs.tickers || 'NVDA AAPL MSFT AMZN GOOGL' }}

      - name: Commit to bqe-frontend
        working-directory: frontend
        run: |
          git config user.name  "bqe-bot"
          git config user.email "123473580+SchwarzRene@users.noreply.github.com"
          git add research/markettape/data
          if git diff --quiet --cached; then
            echo "nothing changed"
            exit 0
          fi
          git commit -m "Market tape $(date -u +'%Y-%m-%d %H:%M')"
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "push rejected, rebasing onto the remote (attempt $attempt)"
            git pull --rebase --autostash origin main || exit 1
            sleep 5
          done
          exit 1
