name: CI

# Every push and every pull request. This is the gate the deploy workflow
# waits on, so a red run here means nothing reaches Azure.
on:
  pull_request:
  # Pushes to main reach these checks through deploy.yml, which calls this
  # workflow as its first job — so main is gated without running CI twice.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Test
        run: pytest

      # A Dockerfile that does not build is a deploy that fails five minutes
      # later, so it is checked here on every pull request too.
      - name: Build the image
        run: docker build -t bqe-backend:ci .

      - name: Smoke-test the image
        run: |
          docker run -d --name smoke -p 8080:8080 bqe-backend:ci
          for attempt in $(seq 1 20); do
            if curl -fsS http://localhost:8080/healthz; then
              echo "\nhealthy after ${attempt}s"
              docker rm -f smoke
              exit 0
            fi
            sleep 1
          done
          echo "container never became healthy"
          docker logs smoke
          docker rm -f smoke
          exit 1
