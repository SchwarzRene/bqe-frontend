# Lint and format settings, shared by the pre-commit habit and CI.
target-version = "py312"
line-length = 100

[lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
  "E501",   # line length is handled by the formatter
  "B008",   # FastAPI's Depends() in defaults is the documented idiom
]

[lint.per-file-ignores]
# The market-data scripts came over from the old repo unchanged on purpose;
# they are standalone jobs, not part of the service, and rewriting them to
# suit a linter would be churn with no reader.
"automation/scripts/*.py" = ["ALL"]
"tests/*.py" = ["S101"]

# The formatter, unlike the linter, has no per-file ignore list, so the
# market-data scripts are excluded outright. They arrived working from the
# previous repo; reformatting them would be a large diff no reader benefits
# from, and would bury any real change in future.
[format]
exclude = ["automation/scripts/*.py"]
